<!DOCTYPE html>
<html>
<head>
  <title>Analytics Tester</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f0f0f0; }
    .box { background: white; padding: 20px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #2BA4DB; }
    button { background: #2BA4DB; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    button:hover { background: #1d7fa8; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 4px; overflow-x: auto; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>📊 Analytics Tester</h1>
  
  <div class="box">
    <h2>Load Analytics</h2>
    <button onclick="loadAnalytics()">Load analytics.js</button>
    <pre id="load-status">Not loaded yet</pre>
  </div>

  <div class="box">
    <h2>Test Recording</h2>
    <p>This simulates what the game does:</p>
    <button onclick="startSession()">Start Session (like Play button)</button>
    <button onclick="endSession()">End Session (like Win)</button>
    <pre id="session-log"></pre>
  </div>

  <div class="box">
    <h2>View Stored Data</h2>
    <button onclick="showData()">Show All Data</button>
    <button onclick="clearData()">Clear Data</button>
    <pre id="data-display"></pre>
  </div>

  <script src="analytics.js"></script>
  <script>
    let currentSessionId = null;
    const log = (msg) => {
      const el = document.getElementById('session-log');
      el.textContent += msg + '\n';
      console.log(msg);
    };

    function loadAnalytics() {
      const status = document.getElementById('load-status');
      if (typeof Analytics !== 'undefined') {
        status.textContent = '✅ Analytics loaded!\n\nAvailable methods:\n' + Object.keys(Analytics).join('\n');
        console.log('Analytics object:', Analytics);
      } else {
        status.textContent = '❌ Analytics not defined!';
      }
    }

    function startSession() {
      document.getElementById('session-log').textContent = '';
      log('▶️  Calling Analytics.startSession("normal")');
      
      try {
        currentSessionId = Analytics.startSession('normal');
        log('✅ Session started with ID: ' + currentSessionId);
      } catch (e) {
        log('❌ ERROR: ' + e.message);
      }
    }

    function endSession() {
      log('\n▶️  Calling Analytics.endSession()');
      
      if (!currentSessionId) {
        log('❌ No session started! Click "Start Session" first');
        return;
      }

      try {
        Analytics.endSession(currentSessionId, true, 35, 5200, 42);
        log('✅ Session ended');
        log('Parameters: solved=true, time=35s, distance=5200m, moves=42');
      } catch (e) {
        log('❌ ERROR: ' + e.message);
      }
    }

    function showData() {
      const display = document.getElementById('data-display');
      const storageKey = 'everyDropCounts_analytics';
      const data = localStorage.getItem(storageKey);
      
      if (!data) {
        display.textContent = '❌ No data found';
        return;
      }

      try {
        const parsed = JSON.parse(data);
        display.textContent = JSON.stringify(parsed, null, 2);
      } catch (e) {
        display.textContent = '❌ Error: ' + e.message;
      }
    }

    function clearData() {
      if (confirm('Clear all analytics data?')) {
        localStorage.removeItem('everyDropCounts_analytics');
        showData();
      }
    }

    // Auto-load on page load
    window.addEventListener('load', loadAnalytics);
  </script>
</body>
</html>
