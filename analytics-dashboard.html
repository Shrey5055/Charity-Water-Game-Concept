<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every Drop Counts — Analytics Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #2BA4DB 0%, #1D9E75 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .content { padding: 40px 20px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: #f5f7fa;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border-left: 4px solid #2BA4DB;
    }
    .stat-card.success { border-left-color: #1D9E75; }
    .stat-card.warning { border-left-color: #FFC107; }
    .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #333;
      margin: 10px 0;
    }
    .stat-label {
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .difficulty-section {
      margin-bottom: 40px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .difficulty-header {
      background: #f5f7fa;
      padding: 20px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .difficulty-header.easy { background: linear-gradient(90deg, #a8e6cf 0%, #dcedc1 100%); }
    .difficulty-header.normal { background: linear-gradient(90deg, #ffd3b6 0%, #ffaaa5 100%); }
    .difficulty-header.hard { background: linear-gradient(90deg, #ff8b94 0%, #ff6b6b 100%); }

    .difficulty-content {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .diff-stat {
      background: white;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    .diff-stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #2BA4DB;
    }
    .diff-stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #2BA4DB;
      color: white;
    }
    .btn-primary:hover { background: #1d7fa8; }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-secondary:hover { background: #e0e0e0; }
    .btn-danger {
      background: #ff6b6b;
      color: white;
    }
    .btn-danger:hover { background: #ee5a52; }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    .no-data p { margin: 10px 0; font-size: 14px; }

    .footer {
      text-align: center;
      padding: 20px;
      background: #f5f7fa;
      font-size: 12px;
      color: #999;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #2BA4DB;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .header { padding: 30px 15px; }
      .header h1 { font-size: 20px; }
      .content { padding: 20px 15px; }
      .stats-grid { grid-template-columns: 1fr; }
      .stat-value { font-size: 28px; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Every Drop Counts Analytics</h1>
      <p>Track your gameplay data for your resume</p>
    </div>

    <div class="content">
      <a href="index.html" class="back-link">← Back to game</a>

      <div id="stats-container">
        <div class="no-data">
          <p>No gameplay data yet. Play some games to see your stats!</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="exportJSON()">📥 Export JSON</button>
        <button class="btn-primary" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn-secondary" onclick="refreshStats()">🔄 Refresh</button>
        <button class="btn-danger" onclick="clearData()">🗑️ Clear All Data</button>
      </div>

      <div class="footer">
        <p>💡 Tip: Use this data for your resume! Export it and share completion rates, average times, and difficulty breakdowns.</p>
      </div>
    </div>
  </div>

  <script src="analytics.js"></script>
  <script>
    function formatStats() {
      console.log('📊 formatStats() called');
      console.log('Analytics object:', typeof Analytics, Analytics);
      
      if (!Analytics || !Analytics.getStats) {
        console.error('❌ Analytics not loaded!');
        document.getElementById('stats-container').innerHTML = `
          <div class="no-data">
            <p>❌ Error: Analytics script not loaded properly</p>
            <p>Try refreshing the page (F5)</p>
          </div>
        `;
        return;
      }
      
      const stats = Analytics.getStats();
      console.log('📊 Stats:', stats);
      const hasData = stats.totalPlays > 0;

      if (!hasData) {
        console.log('⚠️ No data found');
        document.getElementById('stats-container').innerHTML = `
          <div class="no-data">
            <p>No gameplay data yet. Play some games to see your stats!</p>
            <p style="margin-top: 20px;"><a href="index.html" style="color: #2BA4DB;">← Play now</a></p>
          </div>
        `;
        return;
      }
      
      console.log('✅ Data found, rendering...');

      let html = `
        <div class="stats-grid">
          <div class="stat-card success">
            <div class="stat-label">Total Plays</div>
            <div class="stat-value">${stats.totalPlays}</div>
          </div>
          <div class="stat-card success">
            <div class="stat-label">Completions</div>
            <div class="stat-value">${stats.totalCompleted}</div>
          </div>
          <div class="stat-card warning">
            <div class="stat-label">Completion Rate</div>
            <div class="stat-value">${stats.completionRate}%</div>
          </div>
        </div>
      `;

      // Difficulty breakdown
      const difficulties = ['easy', 'normal', 'hard'];
      difficulties.forEach(diff => {
        const d = stats.byDifficulty[diff];
        const icon = diff === 'easy' ? '🟢' : diff === 'normal' ? '🟡' : '🔴';
        
        html += `
          <div class="difficulty-section">
            <div class="difficulty-header ${diff}">
              ${icon} ${diff.toUpperCase()}
            </div>
            <div class="difficulty-content">
              <div class="diff-stat">
                <div class="diff-stat-label">Plays</div>
                <div class="diff-stat-value">${d.plays}</div>
              </div>
              <div class="diff-stat">
                <div class="diff-stat-label">Completions</div>
                <div class="diff-stat-value">${d.completions}</div>
              </div>
              <div class="diff-stat">
                <div class="diff-stat-label">Completion Rate</div>
                <div class="diff-stat-value">${d.completionRate}%</div>
              </div>
              <div class="diff-stat">
                <div class="diff-stat-label">Avg Time</div>
                <div class="diff-stat-value">${d.averageTime}</div>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('stats-container').innerHTML = html;
    }

    function exportJSON() {
      Analytics.exportJSON();
    }

    function exportCSV() {
      Analytics.exportCSV();
    }

    function refreshStats() {
      formatStats();
    }

    function clearData() {
      if (Analytics.clearData()) {
        formatStats();
      }
    }

    // Initial load - wait for analytics.js to load
    if (typeof Analytics !== 'undefined') {
      console.log('✅ Analytics loaded, calling formatStats()');
      formatStats();
    } else {
      console.warn('⚠️ Waiting for Analytics to load...');
      setTimeout(() => {
        if (typeof Analytics !== 'undefined') {
          console.log('✅ Analytics now loaded');
          formatStats();
        } else {
          console.error('❌ Analytics failed to load after timeout');
        }
      }, 1000);
    }
  </script>
</body>
</html>
