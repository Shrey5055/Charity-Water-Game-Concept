<!DOCTYPE html>
<html>
<head>
  <title>localStorage Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f0f0f0; }
    .box { background: white; padding: 20px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #2BA4DB; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 4px; overflow-x: auto; max-height: 500px; overflow-y: auto; }
    .error { border-left-color: #ff6b6b; }
    .success { border-left-color: #4EC9B0; }
    h1 { color: #2BA4DB; }
    h2 { color: #333; margin-top: 0; }
  </style>
</head>
<body>
  <h1>🔍 localStorage Debug Test</h1>
  <p>Checking for analytics data...</p>
  
  <div class="box" id="storage-check">
    <h2>Storage Check</h2>
    <pre id="storage-status">Checking localStorage...</pre>
  </div>

  <div class="box" id="data-box">
    <h2>Analytics Data</h2>
    <pre id="data-output">Loading...</pre>
  </div>

  <div class="box">
    <h2>All localStorage keys</h2>
    <pre id="all-keys">Loading...</pre>
  </div>

  <script>
    // Wait for DOM to fully load
    document.addEventListener('DOMContentLoaded', function() {
      try {
        // Check if localStorage works
        localStorage.setItem('_test', '1');
        localStorage.removeItem('_test');
        document.getElementById('storage-status').textContent = '✅ localStorage is available and working';
      } catch (e) {
        document.getElementById('storage-status').textContent = '❌ localStorage not available:\n' + e.message;
        document.getElementById('storage-check').classList.add('error');
      }

      // Check analytics data
      const storageKey = 'everyDropCounts_analytics';
      const data = localStorage.getItem(storageKey);
      const dataBox = document.getElementById('data-box');
      const output = document.getElementById('data-output');
      
      if (data) {
        try {
          const parsed = JSON.parse(data);
          output.textContent = JSON.stringify(parsed, null, 2);
          dataBox.classList.add('success');
          
          // Show summary
          console.log('✅ DATA FOUND:');
          console.log('Total plays:', parsed.totalSessions);
          console.log('Completions:', parsed.completedSessions);
        } catch (e) {
          output.textContent = '❌ Data is corrupted:\n' + e.message + '\n\nRaw:\n' + data.substring(0, 200);
          dataBox.classList.add('error');
        }
      } else {
        output.textContent = '❌ NO DATA FOUND\n\nNo analytics data in localStorage.\nPlay some games first!';
        dataBox.classList.add('error');
      }

      // Show all keys
      let allKeys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        allKeys.push(key + ' = ' + (localStorage.getItem(key).length + ' chars'));
      }
      
      const keysOutput = document.getElementById('all-keys');
      if (allKeys.length === 0) {
        keysOutput.textContent = '(localStorage is empty)';
      } else {
        keysOutput.textContent = allKeys.join('\n');
      }
    });
  </script>
</body>
</html>
