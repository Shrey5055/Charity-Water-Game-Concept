<!DOCTYPE html>
<html>
<head>
  <title>localStorage Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f0f0f0; }
    .box { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2BA4DB; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 4px; overflow-x: auto; }
    .error { border-left-color: #ff6b6b; color: #ff6b6b; }
    .success { border-left-color: #4EC9B0; color: #4EC9B0; }
  </style>
</head>
<body>
  <h1>🔍 localStorage Debug Test</h1>
  
  <div class="box">
    <h2>What's in localStorage?</h2>
    <pre id="output">Loading...</pre>
  </div>

  <div class="box">
    <h2>All localStorage keys:</h2>
    <pre id="keys">Loading...</pre>
  </div>

  <script>
    // Show all localStorage
    const output = document.getElementById('output');
    const keysDisplay = document.getElementById('keys');
    
    const storageKey = 'everyDropCounts_analytics';
    const data = localStorage.getItem(storageKey);
    
    if (data) {
      try {
        const parsed = JSON.parse(data);
        output.textContent = JSON.stringify(parsed, null, 2);
        document.querySelector('.box').className = 'box success';
      } catch (e) {
        output.textContent = '❌ ERROR: ' + e.message + '\n\nRaw data:\n' + data;
        document.querySelector('.box').className = 'box error';
      }
    } else {
      output.textContent = '❌ NO DATA FOUND\n\nStorage key: ' + storageKey;
      document.querySelector('.box').className = 'box error';
    }

    // Show all keys
    let allKeys = [];
    for (let i = 0; i < localStorage.length; i++) {
      allKeys.push(localStorage.key(i));
    }
    
    if (allKeys.length === 0) {
      keysDisplay.textContent = '(empty)';
    } else {
      keysDisplay.textContent = allKeys.join('\n');
    }
  </script>
</body>
</html>
